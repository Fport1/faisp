name: Compilar macOS y Linux

# Se lanza a mano (Actions → «Compilar macOS y Linux» → Run workflow) o al subir una etiqueta v*.
# Windows se compila en el PC (toolchain GNU con windres); aquí van macOS y Linux.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos:
    # Un solo runner ARM compila las dos arquitecturas y lipo las junta: la app funciona en Intel y en Apple Silicon
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      # Con los mismos secrets de Apple que Modpack Launcher firma y notariza; sin ellos, firma ad-hoc
      - name: Empaquetar faisp.app
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARY_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: faisp-macos
          path: dist/faisp-macos.zip

  linux:
    # 22.04: el binario sale con una glibc antigua y funciona en más distribuciones
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias de WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libssl-dev pkg-config
      - run: cargo build --release
      - run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: faisp-linux
          path: dist/faisp-linux-x64.tar.gz

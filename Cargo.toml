[package]
name = "faisp"
version = "0.12.5"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
calamine = "0.38.0"
chrono = "0.4.45"
dirs = "7.0.0"
futures-util = "0.3.34"
pdf-extract = "0.12.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls", "http2", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
tao = "0.37.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
wry = "0.57.2"
zip = "9.5.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Menú de la app en macOS: sin «Edición», Cmd+C / Cmd+V no funcionan dentro del WebView
muda = "0.21.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[package]
name = "faisp"
version = "0.8.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
calamine = "0.38.0"
chrono = "0.4.45"
dirs = "7.0.0"
futures-util = "0.3.34"
pdf-extract = "0.12.1"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls", "http2", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
wry = "0.57.2"
zip = "9.5.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
